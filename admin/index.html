<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YatraGuide — Admin Console</title>
  <meta name="description" content="YatraGuide enterprise administration console for managing POIs, circuits, stays, users, and real-time API metrics across South India's tourism platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">

  <!-- ════════════════════════════════════════
       APP SHELL
  ════════════════════════════════════════ -->
  <div id="app" class="app-shell">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M14 3V25M3 8.5L25 19.5M25 8.5L3 19.5" stroke="#3B82F6" stroke-width="1.5" opacity="0.4"/>
            <circle cx="14" cy="14" r="3" stroke="#3B82F6" stroke-width="1.5"/>
          </svg>
          <span class="sidebar-logo-text">YatraGuide</span>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <div class="nav-section">
          <span class="nav-section-label">Overview</span>
          <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="nav-label">Dashboard</span>
          </a>
        </div>

        <div class="nav-section">
          <span class="nav-section-label">Content</span>
          <a href="#" class="nav-item" data-page="pois" id="nav-pois">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 9C5.5 12 2 11 2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8 9C10.5 12 14 11 14 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8 15V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">POI Manager</span>
            <span class="nav-badge">2.4k</span>
          </a>
          <a href="#" class="nav-item" data-page="circuits" id="nav-circuits">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 4H13M3 8H10M3 12H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="13" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M13 10V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Circuits</span>
            <span class="nav-badge">48</span>
          </a>
          <a href="#" class="nav-item" data-page="stays" id="nav-stays">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2 13V7L8 3L14 7V13" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <rect x="6" y="9" width="4" height="4" rx="0.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="nav-label">Stays</span>
          </a>
        </div>

        <div class="nav-section">
          <span class="nav-section-label">Operations</span>
          <a href="#" class="nav-item" data-page="users" id="nav-users">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 13C3 10.5 5 9 8 9C11 9 13 10.5 13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Users</span>
          </a>
          <a href="#" class="nav-item" data-page="ingestion" id="nav-ingestion">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 2V10M8 2L5 5M8 2L11 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 10V12C2 12.6 2.4 13 3 13H13C13.6 13 14 12.6 14 12V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Ingestion</span>
            <span class="nav-badge nav-badge--warning">7</span>
          </a>
          <a href="#" class="nav-item" data-page="trips" id="nav-trips">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2 11L5 8L8 10L11 7L14 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="5" cy="8" r="1" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="11" cy="7" r="1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="nav-label">Trips</span>
          </a>
        </div>

        <div class="nav-section">
          <span class="nav-section-label">Infrastructure</span>
          <a href="#" class="nav-item" data-page="api-metrics" id="nav-api">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <polyline points="2,12 5,7 8,9 11,5 14,8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="2" y="2" width="12" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="nav-label">API Metrics</span>
          </a>
          <a href="#" class="nav-item" data-page="settings" id="nav-settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 2V3.5M8 12.5V14M2 8H3.5M12.5 8H14M3.757 3.757L4.818 4.818M11.182 11.182L12.243 12.243M3.757 12.243L4.818 11.182M11.182 4.818L12.243 3.757" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="nav-label">Settings</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">A</div>
          <div class="user-info">
            <span class="user-name">Admin</span>
            <span class="user-role">Super Admin</span>
          </div>
          <button class="user-menu-btn" aria-label="User menu">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="7" cy="3" r="1" fill="currentColor"/>
              <circle cx="7" cy="7" r="1" fill="currentColor"/>
              <circle cx="7" cy="11" r="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="main-content">

      <!-- TOP HEADER / BREADCRUMB BAR -->
      <header class="top-header" role="banner">
        <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
          <span class="breadcrumb-item breadcrumb-root">YatraGuide</span>
          <svg class="breadcrumb-sep" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M4 2L8 6L4 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="breadcrumb-item breadcrumb-current" id="breadcrumb-current">Dashboard</span>
        </div>

        <div class="header-actions">
          <div class="system-status" id="system-status">
            <span class="status-dot status-dot--ok" aria-hidden="true"></span>
            <span class="status-label mono">All systems nominal</span>
          </div>
          <div class="header-time mono" id="header-time" aria-live="polite" aria-label="Current time"></div>
          <button class="header-btn" id="refresh-btn" aria-label="Refresh data" title="Refresh data">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M12 7A5 5 0 1 1 7 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M7 2L9 4L7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="header-btn" id="notifications-btn" aria-label="Notifications (3 unread)" title="Notifications">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1.5C4.5 1.5 3 3 3 5.5V8.5L2 10H12L11 8.5V5.5C11 3 9.5 1.5 7 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M5.5 10C5.5 10.8 6.2 11.5 7 11.5C7.8 11.5 8.5 10.8 8.5 10" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="notif-dot" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <!-- PAGE CONTAINER -->
      <main id="page-container" class="page-container" role="main">
        <!-- Injected by JS -->
      </main>

    </div><!-- /main-content -->
  </div><!-- /app-shell -->

  <script src="app.js"></script>
</body>
</html>
